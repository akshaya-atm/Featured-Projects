services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: elms-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - elms_postgres_data:/var/lib/postgresql/data

volumes:
  elms_postgres_data: