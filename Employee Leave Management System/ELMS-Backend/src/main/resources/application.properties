spring.application.name=ELMS-Backend
logging.level.com.akshaya.elmsbackend.auth.AuthController=DEBUG
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=elms-backend
app.jwt.access-token-ttl-seconds=900
app.leave.time-zone=Asia/Kolkata

# Allow Spring to parse up to 2MB so our service can reject 1MB files with a custom error
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

spring.ai.google.genai.api-key=${API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.tools.throw-exception-on-error=true

spring.ai.mcp.server.name=elms-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false

# Gemini remains responsible for conversation and tool selection
spring.ai.model.chat=google-genai

# Ollama is used only for embeddings
spring.ai.model.embedding=ollama

# Disable Google GenAI's separate text-embedding auto-configuration
spring.ai.model.embedding.text=none

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=nomic-embed-text

# Flyway owns the vector-store schema
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=vector_store
