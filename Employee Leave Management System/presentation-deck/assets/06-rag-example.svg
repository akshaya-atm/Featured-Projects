<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Inter,system-ui,sans-serif">
  <defs>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.5" fill="#8180ff" opacity="0.12"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7" fill="none" stroke="#29cde3" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7" fill="none" stroke="#8180ff" stroke-width="1.5"/>
    </marker>
  </defs>
  
  <rect width="720" height="420" fill="#0d1322" rx="12"/>
  <rect width="720" height="420" fill="url(#dot-grid)" rx="12"/>
  <rect width="720" height="420" fill="none" stroke="#1e2540" stroke-width="2" rx="12"/>

  <!-- User Query -->
  <rect x="200" y="30" width="320" height="40" rx="20" fill="#1e2540" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="55" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">"How much leave can I carry forward?"</text>

  <!-- Arrows down -->
  <line x1="360" y1="70" x2="360" y2="105" stroke="#8180ff" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <rect x="300" y="80" width="120" height="18" rx="9" fill="#121826" stroke="#1e2540"/>
  <text x="360" y="92" fill="#8494ae" font-size="10" text-anchor="middle">nomic-embed-text</text>

  <!-- Vector Store (pgvector) -->
  <rect x="100" y="115" width="160" height="150" rx="8" fill="#0b0f19" stroke="#29cde3" stroke-width="1.5"/>
  <rect x="100" y="115" width="160" height="34" rx="8" fill="rgba(41, 205, 227, 0.1)"/>
  <rect x="100" y="140" width="160" height="9" fill="rgba(41, 205, 227, 0.1)"/>
  <text x="180" y="138" fill="#29cde3" font-size="13" font-weight="700" text-anchor="middle">pgvector</text>
  <line x1="100" y1="149" x2="260" y2="149" stroke="#29cde3" stroke-width="1" stroke-opacity="0.5"/>
  
  <!-- Fake vector blocks -->
  <rect x="120" y="165" width="120" height="14" rx="3" fill="#1e2540"/>
  
  <rect x="116" y="186" width="128" height="22" rx="4" fill="rgba(41, 205, 227, 0.2)" stroke="#29cde3" stroke-width="1"/>
  <rect x="120" y="190" width="120" height="14" rx="3" fill="#29cde3" opacity="0.3"/> <!-- Highlighted match -->
  
  <rect x="120" y="215" width="120" height="14" rx="3" fill="#1e2540"/>
  <rect x="120" y="240" width="120" height="14" rx="3" fill="#1e2540"/>
  
  <!-- Arrow across (FIXED INVALID SVG ENTITY) -->
  <line x1="260" y1="197" x2="330" y2="197" stroke="#29cde3" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <rect x="260" y="172" width="70" height="18" rx="9" fill="#121826" stroke="#1e2540"/>
  <text x="295" y="185" fill="#29cde3" font-size="9" font-weight="700" text-anchor="middle">SIM ≥ 0.65</text>

  <!-- Retrieved Document -->
  <rect x="340" y="145" width="280" height="105" rx="8" fill="#0b0f19" stroke="#8180ff" stroke-width="1.5" stroke-dasharray="4 2"/>
  <rect x="340" y="145" width="280" height="30" fill="rgba(129, 128, 255, 0.15)"/>
  <rect x="340" y="170" width="280" height="5" fill="rgba(129, 128, 255, 0.15)"/>
  <line x1="340" y1="175" x2="620" y2="175" stroke="#8180ff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="355" y="165" fill="#8180ff" font-size="11" font-weight="700">COMPANY POLICY CHUNK</text>
  
  <text x="355" y="196" fill="#a8b5ca" font-size="12">"...employees may carry forward up to</text>
  <!-- Highlighted text -->
  <rect x="353" y="202" width="202" height="18" fill="rgba(41, 205, 227, 0.2)" rx="4"/>
  <text x="355" y="215" fill="#f8fafc" font-size="12" font-weight="600">5 days of unused annual leave</text>
  <text x="355" y="234" fill="#a8b5ca" font-size="12">into the following calendar year..."</text>

  <!-- Arrow down -->
  <line x1="480" y1="250" x2="480" y2="300" stroke="#8180ff" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="415" y="266" width="130" height="18" rx="9" fill="#121826" stroke="#1e2540"/>
  <text x="480" y="278" fill="#8180ff" font-size="9" font-weight="600" text-anchor="middle">Policy search tool</text>

  <!-- Grounded Response -->
  <rect x="230" y="310" width="260" height="70" rx="10" fill="#1e2540" stroke="#8180ff" stroke-width="1.5" filter="drop-shadow(0 5px 10px rgba(129,128,255,0.1))"/>
  <text x="360" y="338" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">"According to the policy, you can</text>
  <text x="360" y="358" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">carry forward up to 5 days."</text>
  
  <!-- Gemini Icon/Tag -->
  <rect x="440" y="295" width="70" height="24" rx="12" fill="#121826" stroke="#8180ff"/>
  <text x="475" y="311" fill="#8180ff" font-size="10" font-weight="700" text-anchor="middle">Gemini</text>
</svg>
