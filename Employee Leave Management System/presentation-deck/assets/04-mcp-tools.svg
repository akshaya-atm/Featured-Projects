<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Inter,system-ui,sans-serif">
  <defs><pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.5" fill="#8180ff" opacity="0.12"/></pattern></defs>
  <rect width="720" height="420" fill="#0d1322" rx="12"/>
  <rect width="720" height="420" fill="url(#dot-grid)" rx="12"/>
  <rect width="720" height="420" fill="none" stroke="#1e2540" stroke-width="2" rx="12"/>

  <defs>
    <linearGradient id="purple-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8180ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8180ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#29cde3" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#29cde3" stop-opacity="0.02"/>
    </linearGradient>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7" fill="none" stroke="#29cde3" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-cyan-rev" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,1 L1,4 L8,7" fill="none" stroke="#29cde3" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7" fill="none" stroke="#8180ff" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title / Warning Label -->
  <rect x="235" y="25" width="250" height="24" rx="12" fill="#ef4444" opacity="0.1"/>
  <text x="360" y="41" fill="#ef4444" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">LLM ARGUMENTS ARE NEVER TRUSTED FOR IDENTITY</text>

  <!-- Center: @Tool Implementation -->
  <rect x="230" y="80" width="260" height="170" rx="8" fill="url(#cyan-glow)" stroke="#29cde3" stroke-width="1.5"/>
  <rect x="230" y="80" width="260" height="40" rx="8" fill="#121826" stroke="#29cde3" stroke-width="1.5"/>
  <!-- Hide bottom border of header to merge seamlessly -->
  <rect x="231" y="115" width="258" height="6" fill="#121826"/>
  <text x="360" y="105" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">@Tool Implementation</text>
  <text x="360" y="135" fill="#a8b5ca" font-size="11" text-anchor="middle">EmployeeTools.java</text>

  <!-- Code block inside @Tool -->
  <rect x="250" y="150" width="220" height="85" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="1"/>
  <text x="260" y="172" fill="#a8b5ca" font-size="11" font-family="'JetBrains Mono', monospace">public void applyLeave() {</text>
  
  <!-- Highlighted identity line -->
  <rect x="251" y="180" width="218" height="22" fill="rgba(129, 128, 255, 0.15)"/>
  <text x="275" y="195" fill="#8180ff" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700">String id = getIdentity();</text>
  
  <text x="275" y="218" fill="#a8b5ca" font-size="11" font-family="'JetBrains Mono', monospace">domainService(id);</text>
  <text x="260" y="225" fill="#a8b5ca" font-size="11" font-family="'JetBrains Mono', monospace">}</text>

  <!-- Left: In-App ChatClient -->
  <rect x="40" y="135" width="130" height="60" rx="8" fill="#1e2540" stroke="#4b5563" stroke-width="1.5"/>
  <text x="105" y="160" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">In-App Chat</text>
  <text x="105" y="178" fill="#a8b5ca" font-size="10" text-anchor="middle">Spring AI Client</text>

  <!-- Right: MCP Client -->
  <rect x="550" y="135" width="130" height="60" rx="8" fill="#1e2540" stroke="#4b5563" stroke-width="1.5"/>
  <text x="615" y="160" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">External Agent</text>
  <text x="615" y="178" fill="#a8b5ca" font-size="10" text-anchor="middle">Claude / VS Code</text>

  <!-- Bottom: JWT Identity -->
  <rect x="230" y="320" width="260" height="60" rx="8" fill="url(#purple-glow)" stroke="#8180ff" stroke-width="1.5"/>
  <rect x="230" y="320" width="6" height="60" fill="#8180ff" rx="3"/>
  <text x="360" y="345" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Server Context (JWT)</text>
  <text x="360" y="365" fill="#8180ff" font-size="11" text-anchor="middle">Authenticated Employee Principal</text>

  <!-- Arrows (Clients -> Center) -->
  <line x1="170" y1="165" x2="220" y2="165" stroke="#29cde3" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="195" y="155" fill="#29cde3" font-size="9" font-weight="600" text-anchor="middle">Native</text>
  
  <line x1="550" y1="165" x2="500" y2="165" stroke="#29cde3" stroke-width="2" marker-end="url(#arrow-cyan-rev)"/>
  <text x="525" y="155" fill="#29cde3" font-size="9" font-weight="600" text-anchor="middle">MCP / SSE</text>

  <!-- Arrows (Identity -> Center) -->
  <path d="M 310 320 L 310 260" fill="none" stroke="#8180ff" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-purple)"/>
  <text x="300" y="285" fill="#8180ff" font-size="9" text-anchor="end">via ToolContext</text>

  <path d="M 410 320 L 410 260" fill="none" stroke="#8180ff" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-purple)"/>
  <text x="420" y="285" fill="#8180ff" font-size="9" text-anchor="start">via McpTransport</text>

  <text x="360" y="300" fill="#8494ae" font-size="10" font-weight="600" text-anchor="middle">Injects Trust</text>

</svg>
