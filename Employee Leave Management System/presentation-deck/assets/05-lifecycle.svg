<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Inter,system-ui,sans-serif">
  <defs><pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.5" fill="#8180ff" opacity="0.12"/></pattern></defs>
  <rect width="720" height="420" fill="#0d1322" rx="12"/>
  <rect width="720" height="420" fill="url(#dot-grid)" rx="12"/>
  <rect width="720" height="420" fill="none" stroke="#1e2540" stroke-width="2" rx="12"/>

  <defs>
    <linearGradient id="purple-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8180ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8180ff" stop-opacity="0.05"/>
    </linearGradient>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7" fill="none" stroke="#29cde3" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Top Invariant Equation -->
  <rect x="110" y="30" width="500" height="40" rx="6" fill="#121826" stroke="#334155" stroke-width="1"/>
  <text x="360" y="55" fill="#a8b5ca" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">
    <tspan fill="#29cde3">AVAILABLE</tspan> = (ENTITLED + CARRY_FORWARD) - <tspan fill="#ef4444">USED</tspan> - <tspan fill="#8180ff">RESERVED</tspan>
  </text>

  <!-- Flow connecting the cards -->
  <line x1="210" y1="210" x2="260" y2="210" stroke="#29cde3" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="235" y="195" fill="#29cde3" font-size="10" font-weight="600" text-anchor="middle">AI Applies</text>

  <line x1="450" y1="210" x2="500" y2="210" stroke="#29cde3" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="475" y="195" fill="#29cde3" font-size="10" font-weight="600" text-anchor="middle">Manager Approves</text>

  <!-- Step 1: Initial State -->
  <rect x="50" y="120" width="160" height="180" rx="8" fill="#0b0f19" stroke="#1e2540" stroke-width="1.5"/>
  <rect x="50" y="120" width="160" height="40" rx="8" fill="#1e2540"/>
  <rect x="51" y="150" width="158" height="10" fill="#1e2540"/> <!-- Merge corner -->
  <text x="130" y="145" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">1. Initial State</text>
  
  <text x="70" y="190" fill="#a8b5ca" font-size="11">Entitled:</text>
  <text x="190" y="190" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="end">10 days</text>
  
  <text x="70" y="220" fill="#a8b5ca" font-size="11">Reserved:</text>
  <text x="190" y="220" fill="#8180ff" font-size="12" font-weight="600" text-anchor="end">0 days</text>

  <text x="70" y="250" fill="#a8b5ca" font-size="11">Used:</text>
  <text x="190" y="250" fill="#ef4444" font-size="12" font-weight="600" text-anchor="end">0 days</text>

  <line x1="70" y1="265" x2="190" y2="265" stroke="#1e2540" stroke-width="1"/>
  <text x="70" y="285" fill="#f8fafc" font-size="12" font-weight="700">Available:</text>
  <text x="190" y="285" fill="#29cde3" font-size="13" font-weight="700" text-anchor="end">10 days</text>


  <!-- Step 2: Reserved State (The Lock) -->
  <rect x="270" y="100" width="180" height="220" rx="8" fill="url(#purple-glow)" stroke="#8180ff" stroke-width="2"/>
  <rect x="270" y="100" width="180" height="40" rx="8" fill="#121826"/>
  <rect x="271" y="130" width="178" height="10" fill="#121826"/>
  <text x="360" y="125" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">2. Pending Approval</text>
  
  <!-- Lock Icon / Pill -->
  <rect x="290" y="145" width="140" height="22" rx="11" fill="rgba(129, 128, 255, 0.2)" stroke="#8180ff" stroke-width="1"/>
  <text x="360" y="160" fill="#8180ff" font-size="9" font-weight="700" letter-spacing="0.5" text-anchor="middle">PESSIMISTIC_WRITE LOCK</text>

  <text x="290" y="195" fill="#a8b5ca" font-size="11">Entitled:</text>
  <text x="430" y="195" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="end">10 days</text>
  
  <text x="290" y="225" fill="#a8b5ca" font-size="11">Reserved:</text>
  <text x="430" y="225" fill="#8180ff" font-size="13" font-weight="700" text-anchor="end">+ 3 days</text>

  <text x="290" y="255" fill="#a8b5ca" font-size="11">Used:</text>
  <text x="430" y="255" fill="#ef4444" font-size="12" font-weight="600" text-anchor="end">0 days</text>

  <line x1="290" y1="275" x2="430" y2="275" stroke="#1e2540" stroke-width="1"/>
  <text x="290" y="295" fill="#f8fafc" font-size="12" font-weight="700">Available:</text>
  <text x="430" y="295" fill="#29cde3" font-size="13" font-weight="700" text-anchor="end">7 days</text>


  <!-- Step 3: Settled State -->
  <rect x="510" y="120" width="160" height="180" rx="8" fill="#0b0f19" stroke="#1e2540" stroke-width="1.5"/>
  <rect x="510" y="120" width="160" height="40" rx="8" fill="#1e2540"/>
  <rect x="511" y="150" width="158" height="10" fill="#1e2540"/>
  <text x="590" y="145" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">3. Settled / Released</text>
  
  <text x="530" y="190" fill="#a8b5ca" font-size="11">Entitled:</text>
  <text x="650" y="190" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="end">10 days</text>
  
  <text x="530" y="220" fill="#a8b5ca" font-size="11">Reserved:</text>
  <text x="650" y="220" fill="#8180ff" font-size="12" font-weight="600" text-anchor="end">0 days</text>

  <text x="530" y="250" fill="#a8b5ca" font-size="11">Used:</text>
  <text x="650" y="250" fill="#ef4444" font-size="13" font-weight="700" text-anchor="end">+ 3 days</text>

  <line x1="530" y1="265" x2="650" y2="265" stroke="#1e2540" stroke-width="1"/>
  <text x="530" y="285" fill="#f8fafc" font-size="12" font-weight="700">Available:</text>
  <text x="650" y="285" fill="#29cde3" font-size="13" font-weight="700" text-anchor="end">7 days</text>

  <!-- Bottom Explainer -->
  <text x="360" y="375" fill="#8494ae" font-size="11" text-anchor="middle">Available balance drops immediately upon request. Final settlement shifts Reserved → Used.</text>
  <text x="360" y="390" fill="#8494ae" font-size="11" text-anchor="middle">Concurrent attempts to double-spend are blocked by database locking.</text>

</svg>
