<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Inter,system-ui,sans-serif">
  <defs>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.5" fill="#8180ff" opacity="0.12"/>
    </pattern>
  </defs>
  
  <rect width="720" height="420" fill="#0d1322" rx="12"/>
  <rect width="720" height="420" fill="url(#dot-grid)" rx="12"/>
  <rect width="720" height="420" fill="none" stroke="#1e2540" stroke-width="2" rx="12"/>

  <!-- Browser/App Window -->
  <rect x="40" y="40" width="640" height="340" rx="10" fill="#070c16" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))"/>
  
  <!-- Top Nav -->
  <rect x="40" y="40" width="640" height="46" rx="10" fill="#121826"/>
  <rect x="40" y="76" width="640" height="10" fill="#121826"/> <!-- square bottom corners -->
  <line x1="40" y1="86" x2="680" y2="86" stroke="#1e2540" stroke-width="1.5"/>
  
  <!-- Logo / Title -->
  <rect x="60" y="52" width="22" height="22" rx="6" fill="#8180ff"/>
  <text x="92" y="68" fill="#f8fafc" font-size="14" font-weight="700">ELMS Workspace</text>
  
  <!-- Profile -->
  <circle cx="650" cy="63" r="12" fill="rgba(129, 128, 255, 0.2)" stroke="#8180ff"/>
  <text x="650" y="67" fill="#8180ff" font-size="10" font-weight="700" text-anchor="middle">E2</text>

  <!-- Left Column (Dashboard) -->
  <rect x="60" y="106" width="340" height="254" rx="8" fill="#0b0f19" stroke="#1e2540" stroke-width="1.5"/>
  <text x="85" y="138" fill="#f8fafc" font-size="14" font-weight="600">Annual Leave</text>
  <text x="375" y="138" fill="#29cde3" font-size="22" font-weight="700" text-anchor="end">7 days</text>
  
  <!-- Progress bar -->
  <rect x="85" y="155" width="290" height="8" rx="4" fill="#1e2540"/>
  <rect x="85" y="155" width="190" height="8" rx="4" fill="#8180ff"/>
  
  <text x="85" y="195" fill="#8494ae" font-size="11" font-weight="700" letter-spacing="1">RECENT REQUESTS</text>
  
  <!-- Table rows -->
  <rect x="85" y="210" width="290" height="34" rx="6" fill="#121826"/>
  <text x="97" y="231" fill="#f8fafc" font-size="12">Dec 22 - Dec 24</text>
  <text x="240" y="231" fill="#a8b5ca" font-size="12">Vacation</text>
  <text x="363" y="231" fill="#22c55e" font-size="11" font-weight="600" text-anchor="end">Approved</text>

  <rect x="85" y="252" width="290" height="34" rx="6" fill="#121826"/>
  <text x="97" y="273" fill="#f8fafc" font-size="12">Jan 13 - Jan 13</text>
  <text x="240" y="273" fill="#a8b5ca" font-size="12">Vacation</text>
  <text x="363" y="273" fill="#eab308" font-size="11" font-weight="600" text-anchor="end">Pending</text>

  <!-- Right Column (AI Assistant) -->
  <rect x="420" y="106" width="240" height="254" rx="8" fill="#0b0f19" stroke="#8180ff" stroke-width="1.5" filter="drop-shadow(0 0 10px rgba(129,128,255,0.1))"/>
  
  <rect x="420" y="106" width="240" height="40" rx="8" fill="rgba(129, 128, 255, 0.1)"/>
  <rect x="420" y="136" width="240" height="10" fill="rgba(129, 128, 255, 0.1)"/>
  <text x="440" y="131" fill="#8180ff" font-size="13" font-weight="700">Leave Assistant</text>
  <line x1="420" y1="146" x2="660" y2="146" stroke="#1e2540" stroke-width="1"/>
  
  <!-- User Bubble -->
  <rect x="470" y="166" width="170" height="36" rx="8" fill="#1e2540"/>
  <text x="482" y="182" fill="#f8fafc" font-size="11">I need to take off next</text>
  <text x="482" y="196" fill="#f8fafc" font-size="11">Tuesday.</text>
  
  <!-- System/Tool Bubble -->
  <rect x="440" y="214" width="180" height="24" rx="6" fill="#121826" stroke="#29cde3" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="450" y="230" fill="#29cde3" font-size="10" font-family="'JetBrains Mono', monospace">🛠️ apply_leave(2026-01-13)</text>

  <!-- AI Bubble -->
  <rect x="440" y="246" width="170" height="50" rx="8" fill="rgba(129, 128, 255, 0.15)" stroke="#8180ff" stroke-width="1"/>
  <text x="452" y="262" fill="#f8fafc" font-size="11">I've reserved your leave for</text>
  <text x="452" y="276" fill="#f8fafc" font-size="11">Jan 13. It is currently</text>
  <text x="452" y="290" fill="#f8fafc" font-size="11">pending approval.</text>

  <!-- Input box -->
  <rect x="435" y="316" width="210" height="32" rx="16" fill="#070c16" stroke="#334155"/>
  <text x="450" y="336" fill="#8494ae" font-size="11">Message AI...</text>
</svg>
