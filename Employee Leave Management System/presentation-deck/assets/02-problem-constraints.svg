<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Inter,system-ui,sans-serif">
  <defs><pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.5" fill="#8180ff" opacity="0.12"/></pattern></defs>
  <rect width="720" height="420" fill="#0d1322" rx="12"/>
  <rect width="720" height="420" fill="url(#dot-grid)" rx="12"/>
  <rect width="720" height="420" fill="none" stroke="#1e2540" stroke-width="2" rx="12"/>

  <defs>
    <linearGradient id="purple-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8180ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8180ff" stop-opacity="0.05"/>
    </linearGradient>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,2 L8,5 L0,8" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Central LLM (The Untrusted Client) -->
  <rect x="280" y="160" width="160" height="100" rx="12" fill="#1e2540" stroke="#29cde3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="360" cy="190" r="14" fill="#29cde3" opacity="0.2"/>
  <path d="M360,182 L363,188 L369,189 L364,193 L365,199 L360,195 L355,199 L356,193 L351,189 L357,188 Z" fill="#29cde3"/>
  <text x="360" y="225" fill="#29cde3" font-size="14" font-weight="700" text-anchor="middle">Untrusted LLM</text>
  <text x="360" y="242" fill="#a8b5ca" font-size="10" text-anchor="middle">Natural Language Input</text>

  <!-- Threat Arrows (Radiating outward) -->
  <g stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7">
    <!-- Up (Spoofing) -->
    <line x1="360" y1="150" x2="360" y2="110" marker-end="url(#arrow-red)"/>
    <text x="370" y="135" fill="#ef4444" font-size="9" font-weight="600" opacity="0.9">Spoofed ID</text>
    
    <!-- Down (Race Condition) -->
    <line x1="360" y1="270" x2="360" y2="310" marker-end="url(#arrow-red)"/>
    <text x="370" y="295" fill="#ef4444" font-size="9" font-weight="600" opacity="0.9">Double-spend</text>
    
    <!-- Left (Hallucination) -->
    <line x1="270" y1="210" x2="230" y2="210" marker-end="url(#arrow-red)"/>
    <text x="250" y="202" fill="#ef4444" font-size="9" font-weight="600" text-anchor="middle" opacity="0.9">Hallucination</text>
    
    <!-- Right (Bypass) -->
    <line x1="450" y1="210" x2="490" y2="210" marker-end="url(#arrow-red)"/>
    <text x="470" y="202" fill="#ef4444" font-size="9" font-weight="600" text-anchor="middle" opacity="0.9">Bypass Rule</text>
  </g>

  <!-- 1. Identity Barrier (Top) -->
  <rect x="250" y="40" width="220" height="60" rx="8" fill="url(#purple-glow)" stroke="#8180ff" stroke-width="1.5"/>
  <rect x="250" y="40" width="4" height="60" fill="#8180ff" rx="2"/>
  <text x="360" y="62" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">1. Identity</text>
  <text x="360" y="80" fill="#a8b5ca" font-size="10" text-anchor="middle">JWT Context, not arguments</text>

  <!-- 4. Concurrency Barrier (Bottom) -->
  <rect x="250" y="320" width="220" height="60" rx="8" fill="url(#purple-glow)" stroke="#8180ff" stroke-width="1.5"/>
  <rect x="250" y="320" width="4" height="60" fill="#8180ff" rx="2"/>
  <text x="360" y="342" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">4. Concurrency</text>
  <text x="360" y="360" fill="#a8b5ca" font-size="10" text-anchor="middle">Pessimistic DB Locks</text>

  <!-- 2. Grounding Barrier (Left) -->
  <rect x="20" y="180" width="200" height="60" rx="8" fill="url(#purple-glow)" stroke="#8180ff" stroke-width="1.5"/>
  <rect x="216" y="180" width="4" height="60" fill="#8180ff" rx="2"/>
  <text x="120" y="202" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">2. Grounding</text>
  <text x="120" y="220" fill="#a8b5ca" font-size="10" text-anchor="middle">RAG &amp; Absolute Time</text>

  <!-- 3. Authorization Barrier (Right) -->
  <rect x="500" y="180" width="200" height="60" rx="8" fill="url(#purple-glow)" stroke="#8180ff" stroke-width="1.5"/>
  <rect x="500" y="180" width="4" height="60" fill="#8180ff" rx="2"/>
  <text x="600" y="202" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">3. Authorization</text>
  <text x="600" y="220" fill="#a8b5ca" font-size="10" text-anchor="middle">Stage-Gated Routing</text>

  <!-- Outer Domain Box (The protected layer) -->
  <!-- We imply the space outside the barriers is protected -->
  <text x="360" y="25" fill="#8494ae" font-size="10" font-weight="600" letter-spacing="2" text-anchor="middle">THE DOMAIN BOUNDARY</text>

</svg>
