<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSphere - My Profile</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/chatbot.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar"></header>

  <main class="page-shell">
    <section class="profile-card" aria-labelledby="profile-title">
      <div class="brand-block">
        <span class="auth-icon">👤</span>
        <h1 id="profile-title">My Profile</h1>
        <p class="intro">Manage your personal details and account security.</p>
      </div>

      <div class="profile-tabs">
        <button id="tabPersonal" class="tab-btn active" onclick="switchTab('personal')">Personal Details</button>
        <button id="tabSecurity" class="tab-btn" onclick="switchTab('security')">Security</button>
      </div>

      <div id="sectionPersonal" class="profile-section active">
        <form id="profileForm" class="auth-form" novalidate>
          <div class="form-row read-only">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" readonly disabled>
          </div>

          <div class="form-row read-only">
            <label for="birthday">Birthday</label>
            <input type="date" id="birthday" name="birthday" readonly disabled>
          </div>

          <div class="form-row">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
            <span class="error-message" id="nameError"></span>
          </div>

          <div class="form-row">
            <label for="contact">Mobile Number</label>
            <input type="tel" id="contact" name="contact" required>
            <span class="error-message" id="contactError"></span>
          </div>

          <button type="submit" class="submit-button" id="btnUpdateProfile">Save Changes</button>
          <p class="success-message" id="profileSuccessMsg" role="status"></p>
          <p class="server-error-message" id="profileErrorMsg" role="alert"></p>
        </form>
      </div>

      <div id="sectionSecurity" class="profile-section" style="display: none;">
        <form id="passwordForm" class="auth-form" novalidate>
          <div class="form-row">
            <label for="currentPassword">Current Password</label>
            <div class="password-input-wrapper">
              <input type="password" id="currentPassword" name="currentPassword" required>
              <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('currentPassword')">👁️</button>
            </div>
          </div>

          <div class="form-row">
            <label for="newPassword">New Password</label>
            <div class="password-input-wrapper">
              <input type="password" id="newPassword" name="newPassword" placeholder="At least 8 characters" required>
              <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('newPassword')">👁️</button>
            </div>
            <span class="error-message" id="newPasswordError"></span>
          </div>

          <div class="form-row">
            <label for="confirmPassword">Confirm New Password</label>
            <div class="password-input-wrapper">
              <input type="password" id="confirmPassword" name="confirmPassword" required>
              <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('confirmPassword')">👁️</button>
            </div>
            <span class="error-message" id="confirmPasswordError"></span>
          </div>

          <button type="submit" class="submit-button" id="btnUpdatePassword">Update Password</button>
          <p class="success-message" id="passwordSuccessMsg" role="status"></p>
          <p class="server-error-message" id="passwordErrorMsg" role="alert"></p>
        </form>
      </div>

    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
