<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSphere - Create Account</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/chatbot.css">
  <link rel="stylesheet" href="css/registration.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar"></header>

  <main class="page-shell">
    <section class="auth-card" aria-labelledby="registration-title">
      <div class="brand-block">
        <span class="auth-icon">✨</span>
        <h1 id="registration-title">Create Account</h1>
        <p class="intro">Join ShopSphere to save delivery addresses, claim birthday discounts, and order fresh produce.</p>
      </div>

      <form id="registrationForm" class="auth-form" novalidate>
        <div class="form-row">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required>
          <span class="error-message" id="nameError"></span>
        </div>

        <div class="form-row">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          <span class="error-message" id="emailError"></span>
        </div>

        <div class="form-row">
          <label for="contact">Mobile Number</label>
          <input type="tel" id="contact" name="contact" placeholder="10-digit mobile number" autocomplete="tel" required>
          <span class="error-message" id="contactError"></span>
        </div>

        <div class="form-grid">
          <div class="form-row">
            <label for="birthday">Birthday</label>
            <input type="date" id="birthday" name="birthday" autocomplete="bday" required>
            <span class="error-message" id="birthdayError"></span>
          </div>

          <div class="form-row">
            <label for="password">Password</label>
            <div class="password-input-wrapper">
              <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required>
              <button type="button" id="toggleRegPassword" class="toggle-password-btn" title="Show password" aria-label="Toggle password visibility">👁️</button>
            </div>
            <span class="error-message" id="passwordError"></span>
          </div>
        </div>

        <button type="submit" class="submit-button">Create Account</button>
        <p class="success-message" id="successMessage" role="status"></p>
        <p class="server-error-message" id="serverError" role="alert"></p>

        <div class="auth-footer-links">
          <p>Already have an account? <a href="login.html">Sign in here</a></p>
          <p><a href="index.html" class="back-link">&larr; Back to Home</a></p>
        </div>
      </form>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/registration.js"></script>
</body>
</html>
