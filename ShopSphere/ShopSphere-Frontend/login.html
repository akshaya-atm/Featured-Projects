<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSphere - Login to Your Account</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/chatbot.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar"></header>

  <main class="page-shell">
    <section class="auth-card">
      <div class="brand-block">
        <span class="auth-icon">🔐</span>
        <h1>Welcome Back</h1>
        <p class="intro">Sign in to your ShopSphere account to claim member discounts and track fresh orders.</p>
      </div>

      <form class="auth-form" onsubmit="return false;">
        <div class="form-row">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-row">
          <label for="login-password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" id="toggleLoginPassword" class="toggle-password-btn" title="Show password" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <div class="btn-group">
          <button type="button" id="login-reset" class="btn-secondary">Clear</button>
          <button type="button" id="login-submit" class="btn-primary">Sign In</button>
        </div>

        <p id="login-message" class="auth-status-msg"></p>

        <div class="auth-footer-links">
          <p>Don't have an account? <a href="registration.html">Create one here</a></p>
          <p><a href="index.html" class="back-link">&larr; Back to Home</a></p>
        </div>
      </form>
    </section>
  </main>

  <script src="js/common.js" defer></script>
  <script src="js/login.js" defer></script>
</body>
</html>
