<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSphere - Premium Groceries & Fresh Produce</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/chatbot.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar"></header>

  <main class="hero-carousel-section">
    <div class="carousel-container">

      <div class="carousel-track" id="carouselTrack">
        <!-- Slides dynamically generated by index.js -->
      </div>

      <button class="carousel-control prev-btn" id="prevSlideBtn" aria-label="Previous Slide">&lang;</button>
      <button class="carousel-control next-btn" id="nextSlideBtn" aria-label="Next Slide">&rang;</button>

      <div class="carousel-pagination" id="carouselPagination">
        <!-- Pagination dots rendered by JS -->
      </div>

    </div>
  </main>

  <section class="categories-section">
    <div class="section-header">
      <h2>Explore Categories</h2>
      <a href="products.html" class="see-all-link">View All Products &rarr;</a>
    </div>

    <div class="categories-grid" id="homeCategoriesGrid">
      <!-- Dynamic category cards -->
    </div>
  </section>

  <section class="deals-section">
    <div class="section-header">
      <h2>🔥 Today's Top Deals & Flash Sales</h2>
      <a href="products.html" class="see-all-link">Shop All Deals &rarr;</a>
    </div>

    <div class="deals-grid" id="homeDealsGrid">
      <!-- Dynamic product deal cards -->
    </div>
  </section>

  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
